<style>
  :root{
    --ink: #232323;
    --ink-soft: #5b5b52;
    --paper: #F6F3EA;
    --paper-raised: #FFFFFF;
    --juniper-deep: #1F3B2D;
    --juniper-mid: #4A6B52;
    --brass: #B8933B;
    --brass-soft: #E8D9B0;
    --rule: #D8D2C0;
    --danger: #A34433;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(31,59,45,0.06), 0 6px 20px rgba(31,59,45,0.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(31,59,45,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'PretendardVariable','Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  #root{min-height:100vh;}

  .shell{
    max-width:760px;
    margin:0 auto;
    padding: 28px 20px 80px;
  }

  /* ---------- Header ---------- */
  .header{ text-align:center; padding: 18px 0 10px; }
  .header .brand{
    font-family:'PretendardVariable','Pretendard',sans-serif;
    font-weight: 600;
    font-size: 28px;
    color: var(--juniper-deep);
    letter-spacing: 0.01em;
  }
  .header .doc-title{
    margin-top:4px;
    font-size:14px;
    color: var(--ink-soft);
    letter-spacing: 0.24em;
  }

  .staff{
    height: 14px;
    margin: 18px auto 22px;
    max-width: 520px;
    background-image: repeating-linear-gradient(
      to bottom,
      var(--rule) 0px, var(--rule) 1px,
      transparent 1px, transparent 3.4px
    );
  }

  /* ---------- Progress ---------- */
  .progress{
    display:flex;
    gap: 10px;
    margin-bottom: 22px;
  }
  .progress .step{
    flex:1;
    text-align:center;
    padding: 12px 8px;
    border-radius: var(--radius);
    background: transparent;
    border: 1px solid var(--rule);
    color: var(--ink-soft);
    font-size: 13px;
    font-weight:600;
  }
  .progress .step .num{
    display:block;
    font-family:'Black Han Sans', sans-serif;
    font-size: 20px;
    margin-bottom:2px;
  }
  .progress .step.active{
    background: var(--juniper-deep);
    border-color: var(--juniper-deep);
    color: #fff;
  }
  .progress .step.done{
    border-color: var(--juniper-mid);
    color: var(--juniper-mid);
  }

  /* ---------- Card ---------- */
  .card{
    background: var(--paper-raised);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 28px 24px 26px;
    border: 1px solid rgba(31,59,45,0.06);
  }
  .section-title{
    font-size: 17px;
    font-weight: 700;
    color: var(--juniper-deep);
    margin: 0 0 18px;
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .section-title .tag{
    font-size:11px;
    font-weight:700;
    letter-spacing:0.08em;
    color: var(--brass);
    border:1px solid var(--brass-soft);
    background: #FBF6E9;
    padding: 2px 8px;
    border-radius: 999px;
  }

  .field{ margin-bottom: 20px; }
  .field label{
    display:block;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--ink);
    margin-bottom: 8px;
  }
  .field .hint{
    font-weight:400;
    color: var(--ink-soft);
    font-size:12px;
    margin-left:6px;
  }
  input[type="text"], input[type="tel"], input[type="date"], input[type="password"], input[type="email"]{
    width:100%;
    min-width:0;
    box-sizing:border-box;
    padding: 14px 14px;
    font-size: 16px;
    border-radius: 12px;
    border: 1.5px solid var(--rule);
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  input[type="date"]{
    -webkit-appearance: none;
    appearance: none;
  }
  input:focus{
    outline: none;
    border-color: var(--juniper-mid);
    box-shadow: 0 0 0 3px rgba(74,107,82,0.15);
  }
  .row2{ display:flex; gap:12px; }
  .row2 > div{ flex:1; min-width:0; }

  .pill-group{ display:flex; flex-wrap:wrap; gap:10px; }
  .pill{
    padding: 12px 18px;
    border-radius: 999px;
    border: 1.5px solid var(--rule);
    background:#fff;
    font-size: 14.5px;
    font-weight:600;
    color: var(--ink-soft);
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color: transparent;
    transition: all .12s ease;
  }
  .pill:active{ transform: scale(0.97); }
  .pill.selected{
    background: var(--juniper-deep);
    border-color: var(--juniper-deep);
    color:#fff;
  }
  .pill.wide{ flex: 1 1 auto; text-align:center; }
  .pill.disabled{ opacity: 0.4; cursor: not-allowed; }
  .pill.disabled:active{ transform: none; }

  /* 선생님 프로필 수정 화면 — 한눈에 보기 편하도록 촘촘하게 */
  .teacher-edit-compact .field{ margin-bottom: 10px; }
  .teacher-edit-compact .field label{ font-size: 11.5px; margin-bottom: 4px; }
  .teacher-edit-compact input[type="text"]{ padding: 9px 10px; font-size: 13px; border-radius: 9px; }
  .teacher-edit-compact .row2{ gap: 8px; }
  .teacher-edit-compact .pill{ padding: 7px 12px; font-size: 12px; }
  .teacher-edit-compact .pill-group{ gap: 6px; }
  .teacher-edit-compact .btn.ghost{ padding: 9px 12px; font-size: 12.5px; }
  .teacher-edit-compact .link-btn{ font-size: 12px; padding: 4px 2px; }

  .block-group{ display:flex; gap:10px; }
  .block-group .pill{ flex:1; text-align:center; padding: 16px 10px; }

  /* ---------- Price box ---------- */
  .price-box{
    background: linear-gradient(155deg, #F9F5E9, #F3EEDD);
    border: 1px solid var(--brass-soft);
    border-radius: 16px;
    padding: 18px 20px;
    margin-top: 4px;
  }
  .price-box .price-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  .price-box .price-label{ font-size:13px; color:var(--ink-soft); font-weight:600;}
  .price-box .price-value{
    font-variant-numeric: tabular-nums;
    font-size: 26px;
    font-weight:800;
    color: var(--juniper-deep);
  }
  .price-box .price-note{ font-size:12px; color:var(--ink-soft); margin-top:4px;}

  /* ---------- Checklist ---------- */
  .check-item{
    display:flex;
    align-items:flex-start;
    gap:12px;
    padding: 13px 4px;
    border-bottom: 1px solid var(--rule);
    cursor:pointer;
  }
  .check-item:last-child{ border-bottom:none; }
  .check-box{
    flex:0 0 22px;
    width:22px; height:22px;
    border-radius:6px;
    border: 1.5px solid var(--ink-soft);
    margin-top:1px;
    display:flex; align-items:center; justify-content:center;
    background:#fff;
  }
  .check-box.checked{
    background: var(--juniper-mid);
    border-color: var(--juniper-mid);
  }
  .check-box svg{ width:14px; height:14px; }
  .check-text{ font-size:14px; line-height:1.5; color:var(--ink); }
  .rule-underline{
    font-weight:700;
    color: #1F3B2D;
    text-decoration: underline;
    text-decoration-color: #B8933B;
    text-decoration-thickness: 2px;
    text-underline-offset: 3px;
  }
  .rule-emphasis-bold{
    font-weight: 800;
    color: #A34433;
  }
  .refund-note{
    font-size: 11.5px;
    line-height:1.5;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  /* ---------- Signature ---------- */
  .sig-wrap{
    border: 1.5px dashed var(--rule);
    border-radius: 14px;
    padding: 10px;
    background: repeating-linear-gradient(45deg, #fff, #fff 10px, #fcfaf3 10px, #fcfaf3 20px);
  }
  canvas#sigpad{
    width:100%;
    height: 200px;
    display:block;
    border-radius: 10px;
    background:#fff;
    touch-action:none;
    overscroll-behavior: contain;
  }
  .sig-actions{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
  }
  .sig-actions .link-btn{
    background:none; border:none;
    color: var(--juniper-mid);
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    padding: 8px 4px;
  }
  .sig-name-confirm{
    font-size:12.5px;
    color: var(--ink-soft);
  }

  /* ---------- Buttons / Nav ---------- */
  .nav-row{
    display:flex;
    justify-content:space-between;
    gap:12px;
    margin-top: 28px;
  }
  .btn{
    flex:1;
    padding: 15px 18px;
    border-radius: 12px;
    font-size: 15.5px;
    font-weight:700;
    border:none;
    cursor:pointer;
    word-break: keep-all;
    -webkit-tap-highlight-color: transparent;
  }
  .btn:active{ transform: scale(0.985); }
  .btn.primary{ background: var(--juniper-deep); color:#fff; }
  .btn.primary:disabled{ background:#B9C3BC; cursor:not-allowed; }
  .btn.brass{ background: var(--brass); color:#fff; }
  .btn.brass:disabled{ background:#DDCFA6; cursor:not-allowed; }
  .btn.ghost{ background:transparent; color: var(--ink-soft); border:1.5px solid var(--rule); word-break: keep-all; }

  .error-banner{
    background:#FBEDEA;
    border:1px solid #EBC6BC;
    color: var(--danger);
    padding: 12px 14px;
    border-radius: 10px;
    font-size:13px;
    margin-bottom: 18px;
    font-weight:600;
  }

  .config-warning{
    max-width:760px;
    margin: 24px auto;
    padding: 16px 18px;
    background:#FBEDEA;
    border:1px solid #EBC6BC;
    color:#7A2E20;
    border-radius:12px;
    font-size:13.5px;
    line-height:1.6;
  }
  .config-warning code{
    background:#fff;
    padding:1px 6px;
    border-radius:5px;
    font-size:12.5px;
  }

  /* ---------- Success ---------- */
  .success-wrap{
    text-align:center;
    padding: 50px 20px 30px;
  }
  .success-wrap .check-circle{
    width:64px; height:64px;
    border-radius:50%;
    background: var(--juniper-deep);
    display:flex; align-items:center; justify-content:center;
    margin: 0 auto 18px;
  }
  .success-wrap h2{
    font-family:'PretendardVariable','Pretendard',sans-serif;
    font-weight:700;
    color: var(--juniper-deep);
    font-size:21px;
    margin: 0 0 8px;
  }
  .success-wrap p{ color: var(--ink-soft); font-size:14px; margin: 4px 0; }

  /* ---------- Address search modal ---------- */
  .addr-modal-backdrop{
    position:fixed; inset:0; background:rgba(31,59,45,0.45);
    display:flex; align-items:center; justify-content:center;
    z-index:1000; padding:20px;
  }
  .addr-modal{
    background:#fff; border-radius:16px; width:100%; max-width:520px;
    height:70vh; overflow:hidden; box-shadow: var(--shadow);
    display:flex; flex-direction:column;
  }
  .addr-modal-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; border-bottom:1px solid var(--rule); flex:0 0 auto;
  }
  .addr-modal-head span{ font-weight:700; color:var(--juniper-deep); font-size:15px; }
  .addr-modal-head button{
    background:none; border:none; font-size:22px; line-height:1;
    color:var(--ink-soft); cursor:pointer; padding:4px 8px;
  }
  .addr-modal-body{ flex:1 1 auto; min-height:0; }
  .addr-modal-body > div{ width:100%; height:100%; }

  @media (max-width: 420px){
    .row2{ flex-direction:column; }
    .header .brand{ font-size:26px; }
  }
</style>
</head>
<body>
<div id="root"></div>
<div id="boot-error" style="display:none; max-width:760px; margin:24px auto; padding:16px 18px; background:#FBEDEA; border:1px solid #EBC6BC; color:#7A2E20; border-radius:12px; font-size:13.5px; line-height:1.6; font-family:sans-serif; white-space:pre-wrap;"></div>
<script>
  // 화면이 비어 보일 때 원인을 바로 알 수 있도록 에러를 화면에 직접 표시합니다.
  window.addEventListener("error", function (e) {
    var box = document.getElementById("boot-error");
    if (!box) return;
    box.style.display = "block";
    box.textContent = "⚠️ 오류가 발생해 화면이 표시되지 않았습니다.\n\n" + (e.message || e) +
      (e.filename ? "\n위치: " + e.filename + ":" + e.lineno : "") +
      "\n\n※ 이 창을 캡처해서 알려주시면 원인을 확인할 수 있습니다.";
  });
</script>

var PRICING_GROUPS = [

];

function priceOptionsFor(enrollType) {
  if (enrollType === "취미") return [
    { key: "1개월(4회)", price: 140000 },
    { key: "3개월(12회)", price: 390000 },
  ];
  if (enrollType === "입시") return [
    { key: "1개월(4회)", price: 220000 },
    { key: "3개월(12회)", price: 630000 },
  ];
  if (enrollType === "그룹") return [
    { key: "1개월(4회)", price: 100000, note: "1인당" },
    { key: "3개월(12회)", price: 300000, note: "1인당" },
  ];
  if (enrollType === "전문") return [
    { key: "1개월(4회)", price: 220000 },
  ];

// ----- 텍스트 붙여넣기로 선생님 프로필 자동 채우기 -----
// 정해진 형식(아래 TEACHER_IMPORT_TEMPLATE 참고)의 텍스트를 파싱해서 선생님 데이터로 변환합니다.
function parseTeacherImportText(text) {
  var lines = (text || "").split(/\r?\n/);
  var result = { name: "", role: "", englishTitle: "", quote: "", instruments: [], education: [], career: [], examResults: [], lessonHistory: [], features: [], lessonDays: "" };
  var mode = null;
  var quoteLines = [];
  function stripBullet(s) { return s.replace(/^[-•]\s*/, "").trim(); }
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i].trim();
    if (!line) continue;
    var m;
    if ((m = line.match(/^이름\s*[:：]\s*(.*)$/))) { result.name = m[1].trim(); mode = null; continue; }
    if ((m = line.match(/^직책\s*[:：]\s*(.*)$/))) { result.role = m[1].trim(); mode = null; continue; }
    if ((m = line.match(/^영문\s*타이틀\s*[:：]\s*(.*)$/))) { result.englishTitle = m[1].trim(); mode = null; continue; }
    if ((m = line.match(/^담당\s*악기\s*[:：]\s*(.*)$/))) { result.instruments = m[1].split(/[,、]/).map(function (s) { return s.trim(); }).filter(Boolean); mode = null; continue; }
    if ((m = line.match(/^레슨\s*가능\s*요일\s*[:：]\s*(.*)$/))) { result.lessonDays = m[1].trim(); mode = null; continue; }
    if ((m = line.match(/^소개\s*문구\s*[:：]?\s*(.*)$/))) { mode = "quote"; quoteLines = m[1] ? [m[1].trim()] : []; continue; }
    if (/^학력사항\s*[:：]?\s*$/.test(line)) { mode = "education"; continue; }
    if (/^경력\s*[:：]?\s*$/.test(line)) { mode = "career"; continue; }
    if (/^제자\s*입시.*[:：]?\s*$/.test(line)) { mode = "examResults"; continue; }
    if (/^이력\s*[:：]?\s*$/.test(line)) { mode = "lessonHistory"; continue; }
    if (/^레슨\s*특징\s*[:：]?\s*$/.test(line)) { mode = "features"; continue; }
    if (mode === "quote") { quoteLines.push(line); continue; }
    if (mode === "education") { result.education.push(stripBullet(line)); continue; }
    if (mode === "career") { result.career.push(stripBullet(line)); continue; }
    if (mode === "examResults") { result.examResults.push({ a: stripBullet(line) }); continue; }
    if (mode === "lessonHistory") { result.lessonHistory.push(stripBullet(line)); continue; }
    if (mode === "features") {
      var content = stripBullet(line);
      var parts = content.split("|");
      result.features.push({ a: (parts[0] || "").trim(), b: (parts[1] || "").trim() });
      continue;
    }
  }
  result.quote = quoteLines.join("\n");
  return result;
}

/* ---------------- Signature Pad ---------------- */
function SignaturePad(props) {
  var onChange = props.onChange;
  var canvasRef = useRef(null);
  var drawing = useRef(false);
  var hasInk = useRef(false);
  var last = useRef({ x: 0, y: 0 });

  useEffect(function () {
    var canvas = canvasRef.current;
    function resize() {
      var rect = canvas.getBoundingClientRect();
      var ratio = window.devicePixelRatio || 1;
      var newWidth = Math.round(rect.width * ratio);
      var newHeight = Math.round(rect.height * ratio);
      // 모바일에서 스크롤/주소창 접힘만으로도 resize 이벤트가 발생하는데,
      // 실제 크기 변화가 없으면 다시 그릴 필요가 없어요 (불필요한 초기화 방지).
      if (newWidth === canvas.width && newHeight === canvas.height) return;
      var prevImage = hasInk.current ? canvas.toDataURL("image/png") : null;
      canvas.width = newWidth;
      canvas.height = newHeight;
      var ctx = canvas.getContext("2d");
      ctx.scale(ratio, ratio);
      ctx.lineWidth = 2.4;
      ctx.lineCap = "round";
      ctx.lineJoin = "round";
      ctx.strokeStyle = "#1F3B2D";
      if (prevImage) {
        var img = new Image();
        img.onload = function () { ctx.drawImage(img, 0, 0, rect.width, rect.height); };
        img.src = prevImage;
      }
    }
    resize();
    window.addEventListener("resize", resize);
    return function () { window.removeEventListener("resize", resize); };
  }, []);

  function getPos(e) {
    var rect = canvasRef.current.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top };
  }

  function start(e) {
    e.preventDefault();
    drawing.current = true;
    last.current = getPos(e);
  }
  function move(e) {
    if (!drawing.current) return;
    e.preventDefault();
    var ctx = canvasRef.current.getContext("2d");
    var pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(last.current.x, last.current.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
    last.current = pos;
    hasInk.current = true;
  }
  function end() {
    if (!drawing.current) return;
    drawing.current = false;
    onChange(hasInk.current ? canvasRef.current.toDataURL("image/png") : null);
  }

  function clear() {
    var canvas = canvasRef.current;
    var ctx = canvas.getContext("2d");
    var rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    hasInk.current = false;
    onChange(null);
  }

  return h("div", null,
    h("div", { className: "sig-wrap" },
      h("canvas", {
        id: "sigpad",
        ref: canvasRef,
        onPointerDown: start,
        onPointerMove: move,
        onPointerUp: end,
        onPointerLeave: end,
      })
    ),
    h("div", { className: "sig-actions" },
      h("span", { className: "sig-name-confirm" }, "위 서명이 본인(또는 법정대리인)의 서명임을 확인합니다."),
      h("button", { type: "button", className: "link-btn", onClick: clear }, "다시 서명")
    )
  );
}

  var isMulti = form.discountType === "두과목 이상 할인";

  var priceOptions = useMemo(function () { return priceOptionsFor(form.enrollType); }, [form.enrollType]);
  var selectedPriceOpt = null;
  for (var i = 0; i < priceOptions.length; i++) {

  }
  var basePrice = selectedPriceOpt ? selectedPriceOpt.price : "";
  var isThreeMonth = form.duration === "3개월(12회)";

  // 3개월(12회) 등록은 가격표 자체에 이미 할인이 포함된 경우가 있어요 (1개월 가격 x 3 대비 할인된 금액).
  // 그 할인 내역을 가격 박스에 보여주고, 중복 할인 방지 여부를 판단하는 데 씁니다.
  var oneMonthOpt = null;
  for (var k = 0; k < priceOptions.length; k++) {
    if (priceOptions[k].key === "1개월(4회)") oneMonthOpt = priceOptions[k];
  }
  var threeMonthRegularPrice = (isThreeMonth && oneMonthOpt) ? oneMonthOpt.price * 3 : null;
  var threeMonthBuiltInDiscount = (threeMonthRegularPrice !== null && basePrice !== "") ? (threeMonthRegularPrice - basePrice) : 0;

  // 이미 할인이 포함된 3개월 상품(취미/입시)이거나 그룹 레슨(별도 요금 체계)이면 추가 할인을 막습니다.
  var discountBlocked = (isThreeMonth && threeMonthBuiltInDiscount > 0) || form.enrollType === "그룹";
  var discountAmount = (form.discountType === "가족할인" && !discountBlocked) ? 10000 : 0;
  var computedPrice = basePrice !== "" ? Math.max(0, basePrice - discountAmount) : "";

  var subjectPrices = form.subjects.map(function (s) {
    var opts = priceOptionsFor(s.enrollType);
    var match = null;
    for (var j = 0; j < opts.length; j++) { if (opts[j].key === s.duration) match = opts[j]; }
    var base = match ? match.price : null;
    // 이미 할인이 포함된 3개월 상품(취미/입시)이거나 그룹 레슨이면, 과목당 할인을 중복 적용하지 않습니다.

    return { base: base, discounted: base !== null ? (alreadyDiscounted ? base : Math.max(0, base - 10000)) : null, note: match ? match.note : null };

  function buildPdfBlob(node) {
    if (!window.html2canvas || !window.jspdf) {

    return window.html2canvas(node, { scale: 2, backgroundColor: "#ffffff" }).then(function (canvas) {
      var imgData = canvas.toDataURL("image/png");
      var jsPDF = window.jspdf.jsPDF;
      var pdf = new jsPDF({ unit: "pt", format: "a4" });
      var pageWidth = pdf.internal.pageSize.getWidth();
      var imgWidth = pageWidth - 40;
      var imgHeight = (canvas.height * imgWidth) / canvas.width;
      pdf.addImage(imgData, "PNG", 20, 20, imgWidth, imgHeight);
      return pdf.output("blob");
    });
  }

          h("div", { className: "price-box" },
            isThreeMonth && threeMonthRegularPrice !== null && threeMonthBuiltInDiscount > 0
              ? h(Frag, null,
                  h("div", { className: "price-row" },
                    h("span", { className: "price-label" }, "기본가격 (1개월×3)"),
                    h("span", null, formatKRW(threeMonthRegularPrice))
                  ),
                  h("div", { className: "price-row", style: { marginTop: "6px" } },
                    h("span", { className: "price-label" }, "3개월 등록 할인"),
                    h("span", { style: { fontWeight: 700, color: "var(--danger)" } }, "-" + formatKRW(threeMonthBuiltInDiscount))
                  ),
                  h("div", { className: "price-row", style: { marginTop: "10px", borderTop: "1px solid var(--brass-soft)", paddingTop: "10px" } },
                    h("span", { className: "price-label" }, "수강료"),
                    h("span", { className: "price-value" }, formatKRW(basePrice))
                  )
                )
              : h(Frag, null,
                  h("div", { className: "price-row" },
                    h("span", { className: "price-label" }, "수강료"),
                    h("span", { className: "price-value" }, basePrice !== "" ? formatKRW(basePrice) : "기간을 선택해 주세요")
                  ),
                  (selectedPriceOpt && selectedPriceOpt.note) ? h("div", { className: "price-note" }, selectedPriceOpt.note + " 기준 금액입니다.") : null,
                  discountAmount > 0 ? h("div", { className: "price-row", style: { marginTop: "10px" } },
                    h("span", { className: "price-label" }, "할인 금액"),
                    h("span", { style: { fontWeight: 700, color: "var(--danger)" } }, "-" + formatKRW(discountAmount))
                  ) : null,
                  discountAmount > 0 ? h("div", { className: "price-row", style: { marginTop: "10px", borderTop: "1px solid var(--brass-soft)", paddingTop: "10px" } },
                    h("span", { className: "price-label" }, "최종 결제 금액"),
                    h("span", { className: "price-value" }, computedPrice !== "" ? formatKRW(computedPrice) : "")
                  ) : null
                )
          )
        ) : null
      ) : h(Frag, null,
        renderDiscountField(),
        h("div", { className: "field" },
          h("label", null, "등록 과목 ", h("span", { className: "hint" }, "과목마다 악기·유형·기간을 각각 선택해 주세요")),
          h("div", null,
            form.subjects.map(function (s, idx) {
              var opts = priceOptionsFor(s.enrollType);
              var sp = subjectPrices[idx] || { base: null, discounted: null };
              return h("div", { key: idx, style: { border: "1px solid var(--rule)", borderRadius: "14px", padding: "14px", marginBottom: "12px" } },
                h("div", { style: { display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "10px" } },
                  h("span", { style: { fontWeight: 700, color: "var(--juniper-deep)", fontSize: "13.5px" } }, "과목 " + (idx + 1)),
                  form.subjects.length > 2 ? h("button", { type: "button", className: "link-btn", style: { color: "var(--danger)" }, onClick: function(){ removeSubject(idx); } }, "삭제") : null
                ),
                h("div", { className: "pill-group", style: { marginBottom: "10px" } },
                  ["보컬", "기타", "베이스", "드럼", "피아노", "작곡(미디)"].map(function (i) {
                    return h(Pill, { key: i, selected: s.instrument===i, onClick: function(){
                      var patch = { instrument: i };
                      if (enrollTypeOptionsFor(i).indexOf(s.enrollType) === -1) {
                        patch.enrollType = "";
                        patch.duration = "";
                      }
                      updateSubject(idx, patch);
                    } }, i);
                  })
                ),
                h("div", { className: "block-group", style: { marginBottom: "10px" } },
                  enrollTypeOptionsFor(s.instrument).map(function (t) {
                    return h(Pill, { key: t, wide: true, selected: s.enrollType===t, onClick: function(){ updateSubject(idx, { enrollType: t, duration: "" }); } }, t);
                  })
                ),
                s.enrollType ? h("div", { className: "pill-group", style: { marginBottom: "10px" } },
                  opts.map(function (opt) {
                    return h(Pill, { key: opt.key, selected: s.duration===opt.key, onClick: function(){ updateSubject(idx, { duration: opt.key }); } },
                      opt.key + (opt.note ? " · " + opt.note : "")
                    );
                  })
                ) : null,
                sp.base !== null ? h("div", { style: { fontSize: "12.5px", color: "var(--ink-soft)" } },
                  "이 과목 수강료: " + formatKRW(sp.discounted) + " (과목당 할인 적용)"
                ) : null
              );
            })
          ),
          h("button", { type: "button", className: "btn ghost", style: { width: "100%" }, onClick: addSubject }, "+ 과목 추가")
        ),

        h("div", { className: "field" },
          h("label", null, "가격"),
          h("div", { className: "price-box" },
            form.subjects.map(function (s, idx) {
              var sp = subjectPrices[idx];
              return h("div", { key: idx, className: "price-row", style: { marginBottom: "6px" } },
                h("span", { className: "price-label" }, "과목 " + (idx + 1) + (s.instrument ? " · " + s.instrument : "")),
                h("span", null, (sp && sp.discounted !== null) ? formatKRW(sp.discounted) : "-")
              );
            }),
            h("div", { className: "price-row", style: { marginTop: "10px", borderTop: "1px solid var(--brass-soft)", paddingTop: "10px" } },
              h("span", { className: "price-label" }, "총 수강료"),
              h("span", { className: "price-value" }, multiComplete ? formatKRW(multiTotal) : "과목 정보를 모두 입력해 주세요")
            )
          )
        )
      ),

      h("div", { className: "field" },
        h("label", null, "학원 원칙"),
        h("div", null,
          ACADEMY_RULES.map(function (rule, idx) {
            return h(CheckItem, {
              key: idx,
              checked: form.rulesChecked[idx],
              onClick: function () {
                var next = form.rulesChecked.slice();
                next[idx] = !next[idx];
                set("rulesChecked", next);
              }
            }, renderRuleContent(rule, idx));
          })
        )
      ),

      h("div", { className: "field" },
        h("label", null, "환불 규정"),
        h(CheckItem, { checked: form.refundChecked, onClick: function(){ set("refundChecked", !form.refundChecked); } },
          h("div", null,
            REFUND_POLICY.map(function (line, idx) {
              return h("div", { key: idx, style: { marginBottom: idx < REFUND_POLICY.length-1 ? "6px" : 0 } }, "· " + line);
            }),
            h("div", { className: "refund-note" }, "* " + REFUND_POLICY_NOTE)
          )
        )
      ),

      h("div", { className: "field" },
        h("label", null, "서명"),
        form.signature
          ? h("div", { onClick: function(){ setSignatureModalOpen(true); }, style: { border: "1.5px dashed var(--rule)", borderRadius: "14px", padding: "14px", textAlign: "center", cursor: "pointer", background: "#fff" } },
              h("img", { src: form.signature, style: { height: "70px" } }),
              h("div", { style: { fontSize: "12px", color: "var(--ink-soft)", marginTop: "6px" } }, "탭하여 다시 서명하기")
            )
          : h("div", { onClick: function(){ setSignatureModalOpen(true); }, style: { border: "1.5px dashed var(--rule)", borderRadius: "14px", padding: "30px", textAlign: "center", cursor: "pointer", background: "#fcfaf3", color: "var(--ink-soft)", fontSize: "14px", fontWeight: 600 } }, "✍️ 탭하여 서명하기")
      ),

      h("div", { className: "nav-row" },
        h("button", { className: "btn ghost", onClick: goBack }, "← 이전"),
        h("button", { className: "btn brass", disabled: submitting, onClick: submit }, submitting ? "제출 중…" : "등록 원서 제출")
      )
    );
  }

  return h(Frag, null,
    h("div", { className: "shell" },
      h("div", { className: "header" },
        h("div", { className: "brand" }, "주니퍼 실용음악학원"),
        h("div", { className: "doc-title" }, "등 록 원 서")
      ),
      h("div", { className: "staff" }),
      h(ProgressBar, { part: part }),
      error ? h("div", { className: "error-banner" }, error) : null,
      h("div", { className: "card" },
        part === 1 ? renderPart1() : null,
        part === 2 ? renderPart2() : null
      ),
      h("div", { style: { textAlign: "center", marginTop: "18px" } },
        h("button", { type: "button", onClick: openAdmin, style: { background: "none", border: "none", color: "var(--ink-soft)", fontSize: "12px", cursor: "pointer", textDecoration: "underline" } }, "학원 관리자이신가요? 등록 목록 보기")
      )
    ),
    addressModalOpen ? h("div", { className: "addr-modal-backdrop", onClick: function(){ setAddressModalOpen(false); } },
      h("div", { className: "addr-modal", onClick: function(e){ e.stopPropagation(); } },
        h("div", { className: "addr-modal-head" },
          h("span", null, "주소 검색"),
          h("button", { type: "button", onClick: function(){ setAddressModalOpen(false); } }, "×")
        ),
        h("div", { className: "addr-modal-body" },
          h("div", { ref: addressContainerRef })
        )
      )
    ) : null,
    signatureModalOpen ? h("div", { className: "addr-modal-backdrop", onClick: function(){ setSignatureModalOpen(false); } },
      h("div", { className: "addr-modal", style: { height: "auto" }, onClick: function(e){ e.stopPropagation(); } },
        h("div", { className: "addr-modal-head" },
          h("span", null, "서명"),
          h("button", { type: "button", onClick: function(){ setSignatureModalOpen(false); } }, "×")
        ),
        h("div", { style: { padding: "16px" } },
          h(SignaturePad, { onChange: function(dataUrl){ set("signature", dataUrl); } }),
          h("button", { type: "button", className: "btn primary", style: { marginTop: "14px", width: "100%" }, onClick: function(){ setSignatureModalOpen(false); } }, "완료")
        )
      )
    ) : null,
    h("div", { ref: printRef, style: { position: "absolute", left: "-9999px", top: 0, width: "700px", background: "#ffffff", padding: "40px", fontFamily: "'PretendardVariable','Pretendard',sans-serif", color: "#232323" } },
      buildSummaryTree(Object.assign({}, form, { price: computedPrice }))
    )
  );
}

var rootEl = document.getElementById("root");
ReactDOM.createRoot(rootEl).render(h(App));

if (!FIREBASE_CONFIGURED) {
  var warn = document.createElement("div");
  warn.className = "config-warning";
  warn.innerHTML = "⚠️ Firebase 설정이 비어 있습니다. 상단 <code>firebaseConfig</code> 값을 실제 프로젝트 정보로 채워야 제출된 원서가 저장됩니다. 지금은 제출해도 브라우저 콘솔에만 기록됩니다.";
  document.body.appendChild(warn);
}
</script>
</body>
</html>
